# StreamRadar from the published image. Put this file in a directory next to
# a .env file, then:
#
#   docker compose up -d
#
# Update with: docker compose pull && docker compose up -d
# Your data lives in ./database.
#
# .env must contain APP_KEY: it encrypts the stored secrets (Twitch client
# secret, SMTP password, alert destination credentials). Keep it with your
# backups; a new key makes those secrets unreadable. Generate one once with:
#
#   echo "APP_KEY=base64:$(openssl rand -base64 32)" >> .env

services:
  streamradar:
    # Another registry or a fixed version: set STREAMRADAR_IMAGE in .env,
    # e.g. STREAMRADAR_IMAGE=ghcr.io/lur1fa/streamradar:1.2.0
    image: ${STREAMRADAR_IMAGE:-ghcr.io/lur1fa/streamradar:latest}
    ports:
      # Bound to loopback by default. Set APP_BIND=0.0.0.0 in .env to expose on
      # the network. Put a TLS reverse proxy in front and set APP_URL=https://…
      # (all links and redirects are then built from APP_URL) and TRUSTED_PROXIES
      # (so the real client IP is seen).
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-8080}:80"
    volumes:
      - ./database:/app/database:z
    # Optional operator overrides (OIDC_*, WEBHOOK_ALLOWED_HOSTS, TRUSTED_PROXIES, …).
    # Values in `environment:` below always win over the file.
    env_file:
      - path: .env
        required: false
    environment:
      - APP_KEY=${APP_KEY:?APP_KEY is missing. Add it to .env, see the top of this file.}
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_URL=${APP_URL:-http://localhost:${APP_PORT:-8080}}
      - INERTIA_DEVTOOLS_ENABLED=false
      - LOG_LEVEL=${LOG_LEVEL:-info}
    restart: unless-stopped
