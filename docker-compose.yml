services:
  streamradar:
    build: .
    ports:
      - "80:80"
    volumes:
      - ./database:/app/database:z
      - ./.git/refs:/app/.git-refs:ro
      - ./.git/HEAD:/app/.git-head:ro
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_URL=http://localhost:8080
      - MAIL_MAILER=smtp
      - MAIL_HOST=mailpit
      - MAIL_PORT=1025
    depends_on:
      - mailpit
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit
    ports:
      - "${MAILPIT_PORT:-8025}:8025"
    restart: unless-stopped

