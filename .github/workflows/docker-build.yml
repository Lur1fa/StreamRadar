name: docker-build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: streamradar:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Check that the frontend was built into the image
        run: |
          docker run --rm --entrypoint sh streamradar:ci -c \
            'test -n "$(ls -A /app/public/build 2>/dev/null)"'

      - name: Check that PHP runs in the image
        run: |
          docker run --rm --entrypoint php streamradar:ci -v